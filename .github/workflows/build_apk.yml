name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Gradle (Force Version 8.4)
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4' # GitHub сам скачает и установит чистый Gradle 8.4, минуя глобальный 9.6.1

    - name: Build Debug APK using global Gradle
      run: gradle assembleDebug # Запускаем сборку напрямую через установленный Gradle 8.4, а не через gradlew
